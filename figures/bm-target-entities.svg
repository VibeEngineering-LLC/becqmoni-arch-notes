<svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5a7d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef3f9; stroke:#2f5b8f; stroke-width:1.6; rx:8; }
    .newbox { fill:#fdf6e3; stroke:#c8901e; stroke-width:1.8; }
    .docbox { fill:#eefaef; stroke:#3c8b46; stroke-width:1.6; }
    .title { font-size:15px; font-weight:600; fill:#1d3a57; }
    .line { font-size:12.5px; fill:#333; }
    .lbl { font-size:12px; fill:#3a5a7d; font-style:italic; }
    .arrow { stroke:#3a5a7d; stroke-width:1.6; fill:none; marker-end:url(#ar); }
    .h { font-size:18px; font-weight:600; fill:#1d3a57; }
    .legend { font-size:12px; fill:#555; }
  </style>

  <text x="30" y="32" class="h">Целевая модель сущностей BecqMoni (жёлтое — новое / меняется)</text>

  <!-- Device -->
  <rect x="60" y="70" width="280" height="120" class="box" rx="8"/>
  <text x="76" y="94" class="title">Device — прибор</text>
  <text x="76" y="116" class="line">калибровки E и FWHM, форма пика</text>
  <text x="76" y="134" class="line">драйвер (звук / VCP / BLE)</text>
  <text x="76" y="152" class="line">умолчание геометрии</text>
  <text x="76" y="170" class="line">дозовые параметры</text>

  <!-- Geometry -->
  <rect x="500" y="60" width="300" height="140" class="box newbox" rx="8"/>
  <text x="516" y="84" class="title">Geometry — геометрия (НОВОЕ)</text>
  <text x="516" y="106" class="line">паспорт: материал, плотность,</text>
  <text x="516" y="123" class="line">расстояние (по образцу .efa LSRM)</text>
  <text x="516" y="141" class="line">кривая ε(E): точки + границы</text>
  <text x="516" y="159" class="line">применимости</text>
  <text x="516" y="184" class="line">одна на измерение, N на прибор</text>

  <!-- Device -> Geometry -->
  <path d="M 340 120 L 500 120" class="arrow"/>
  <text x="395" y="112" class="lbl">1 : N</text>

  <!-- ROIConfig -->
  <rect x="60" y="290" width="280" height="140" class="box newbox" rx="8"/>
  <text x="76" y="314" class="title">ROIConfig — зоны счёта</text>
  <text x="76" y="336" class="line">зоны: границы; нуклид+линия —</text>
  <text x="76" y="354" class="line">опционально (декларативный режим)</text>
  <text x="76" y="372" class="line">правила: алгебра примитивов</text>
  <text x="76" y="394" class="line">БЕЗ вмороженного K и БЕЗ ε;</text>
  <text x="76" y="412" class="line">ручной K — явное переопределение</text>

  <!-- NuclideSet -->
  <rect x="500" y="280" width="300" height="150" class="box newbox" rx="8"/>
  <text x="516" y="304" class="title">NuclideSet — набор нуклидов (живой)</text>
  <text x="516" y="326" class="line">нуклиды + линии (I, якоря);</text>
  <text x="516" y="344" class="line">цепочка: каноничный корень;</text>
  <text x="516" y="362" class="line">маркеры отрисовки (из ROI сюда);</text>
  <text x="516" y="384" class="line">линии — индексами nucdb;</text>
  <text x="516" y="402" class="line">меняется в ходе анализа → пересчёт A</text>

  <!-- nucdb -->
  <rect x="880" y="300" width="160" height="80" class="box" rx="8"/>
  <text x="896" y="324" class="title">nucdb.sqlite</text>
  <text x="896" y="346" class="line">ядерная база</text>
  <text x="896" y="364" class="line">(read-only)</text>

  <!-- NuclideSet -> nucdb -->
  <path d="M 800 340 L 880 340" class="arrow"/>
  <text x="806" y="332" class="lbl">индексы</text>

  <!-- Конструктор -->
  <rect x="880" y="470" width="160" height="110" class="box" rx="8"/>
  <text x="896" y="494" class="title">Конструктор</text>
  <text x="896" y="516" class="line">ROI Wizard:</text>
  <text x="896" y="534" class="line">генерирует ROI</text>
  <text x="896" y="552" class="line">и NuclideSet</text>
  <text x="896" y="570" class="line">по nucdb</text>

  <path d="M 940 470 L 940 390" class="arrow"/>
  <text x="948" y="435" class="lbl">читает</text>
  <path d="M 880 510 L 820 510 L 820 400 L 800 400" class="arrow"/>
  <text x="806" y="446" class="lbl">генерирует</text>

  <!-- Документ спектра -->
  <rect x="60" y="480" width="280" height="150" class="docbox" rx="8"/>
  <text x="76" y="504" class="title">Документ спектра</text>
  <text x="76" y="526" class="line">спектр + фон (фиксируется)</text>
  <text x="76" y="544" class="line">SampleInfo: выбор геометрии</text>
  <text x="76" y="562" class="line">ссылки: Device, ROIConfig,</text>
  <text x="76" y="580" class="line">NuclideSet (единый резолв,</text>
  <text x="76" y="598" class="line">не-матч всегда виден)</text>

  <!-- MeasurementResult -->
  <rect x="440" y="480" width="360" height="150" class="docbox newbox" rx="8"/>
  <text x="456" y="504" class="title">MeasurementResult (СОХРАНЯЕТСЯ — НОВОЕ)</text>
  <text x="456" y="526" class="line">активности, σ, МДА</text>
  <text x="456" y="548" class="line">снапшот: ε(E линий), I, геометрия+версия,</text>
  <text x="456" y="566" class="line">библиотека+версия, границы зон, фон,</text>
  <text x="456" y="584" class="line">переопределения K</text>
  <text x="456" y="608" class="line">открытие = показать сохранённое; пересчёт — явно</text>

  <!-- Документ связи -->
  <path d="M 60 520 L 36 520 L 36 130 L 60 130" class="arrow"/>
  <text transform="rotate(-90 26 330)" x="26" y="330" class="lbl">ссылка на прибор</text>
  <path d="M 340 545 L 440 545" class="arrow"/>
  <text x="352" y="537" class="lbl">содержит</text>
  <path d="M 300 480 L 300 448 L 560 448 L 560 200" class="arrow"/>
  <text x="330" y="466" class="lbl">SampleInfo: выбранная геометрия</text>
  <path d="M 220 480 L 220 430" class="arrow"/>
  <path d="M 260 480 L 260 456 L 500 456 L 500 430" class="arrow"/>

  <text x="30" y="672" class="legend">Синее — существующие сущности (уточняются) · жёлтое — новое или меняющее смысл · зелёное — документ измерения. Стрелки: ссылки и потоки владения.</text>
</svg>
