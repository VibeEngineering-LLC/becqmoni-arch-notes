<svg viewBox="0 0 1400 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5a7d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef3f9; stroke:#2f5b8f; stroke-width:1.6; }
    .newbox { fill:#fdf6e3; stroke:#c8901e; stroke-width:1.8; }
    .srcbox { fill:#f2f2ee; stroke:#777; stroke-width:1.4; }
    .resbox { fill:#eefaef; stroke:#3c8b46; stroke-width:1.8; }
    .title { font-size:14.5px; font-weight:600; fill:#1d3a57; }
    .line { font-size:12.5px; fill:#333; }
    .f { font-size:13px; fill:#1d3a57; font-family:Consolas, monospace; }
    .lbl { font-size:12px; fill:#3a5a7d; font-style:italic; }
    .arrow { stroke:#3a5a7d; stroke-width:1.6; fill:none; marker-end:url(#ar2); }
    .h { font-size:18px; font-weight:600; fill:#1d3a57; }
    .tr { font-size:13px; font-weight:600; fill:#8a6410; }
  </style>

  <text x="30" y="32" class="h">Тракты расчёта активности: экспресс (А) — превью точного (В); два окна результата (жёлтое — новое)</text>

  <!-- Источники живых величин -->
  <rect x="470" y="56" width="180" height="64" rx="8" class="srcbox"/>
  <text x="484" y="80" class="title">Geometry.ε(E)</text>
  <text x="484" y="100" class="line">выбранная геометрия</text>
  <rect x="680" y="56" width="180" height="64" rx="8" class="srcbox"/>
  <text x="694" y="80" class="title">NuclideSet.I</text>
  <text x="694" y="100" class="line">живой набор нуклидов</text>

  <path d="M 560 120 L 560 182" class="arrow"/>
  <path d="M 770 120 L 770 150 L 640 150 L 640 182" class="arrow"/>
  <text x="580" y="145" class="lbl">ε и I — живые, в момент расчёта</text>

  <!-- Спектр -->
  <rect x="30" y="182" width="150" height="360" rx="8" class="box"/>
  <text x="46" y="208" class="title">Спектр</text>
  <text x="46" y="230" class="line">каналы, счёт,</text>
  <text x="46" y="248" class="line">время, фон,</text>
  <text x="46" y="266" class="line">калибровки</text>

  <!-- Тракт А -->
  <text x="220" y="172" class="tr">Тракт А — экспресс: превью тракта В, без поиска пиков, живой при наборе</text>
  <rect x="220" y="182" width="210" height="90" rx="8" class="box"/>
  <text x="234" y="206" class="title">Зоны ROI + правила</text>
  <text x="234" y="226" class="line">алгебра примитивов,</text>
  <text x="234" y="244" class="line">вычет фона, ссылки</text>
  <rect x="470" y="182" width="260" height="90" rx="8" class="newbox"/>
  <text x="484" y="206" class="title">A = net_cps / (ε(E)·I/100)</text>
  <text x="484" y="226" class="line">оценка; линия — из декларации зоны;</text>
  <text x="484" y="244" class="line">ручной K — если переопределён;</text>
  <text x="484" y="262" class="line">уточняется трактом В (фит)</text>

  <!-- Тракт Б -->
  <text x="220" y="312" class="tr">Тракт Б — по выделению</text>
  <rect x="220" y="322" width="210" height="72" rx="8" class="box"/>
  <text x="234" y="346" class="title">Выделенный участок</text>
  <text x="234" y="366" class="line">net = fg − bg·(t_fg/t_bg)</text>
  <rect x="470" y="322" width="260" height="72" rx="8" class="box"/>
  <text x="484" y="346" class="title">A = net / (ε·I/100)</text>
  <text x="484" y="366" class="line">единственный идентифицир. пик</text>

  <!-- Тракт В -->
  <text x="220" y="440" class="tr">Тракт В — точный: по набору нуклидов, фит (НОВЫЙ, этап 7)</text>
  <rect x="220" y="450" width="210" height="100" rx="8" class="box"/>
  <text x="234" y="474" class="title">Библиотечный фиттер</text>
  <text x="234" y="494" class="line">площади S_jk линий,</text>
  <text x="234" y="512" class="line">BR-группы, якоря, вето</text>
  <text x="234" y="530" class="line">(ядро не меняется)</text>
  <rect x="470" y="450" width="260" height="100" rx="8" class="newbox"/>
  <text x="484" y="474" class="title">A_j по нуклиду</text>
  <text x="484" y="496" class="f">A_j = Σw·S_jk/(t·ε(E_k)·I_jk)</text>
  <text x="484" y="518" class="line">одна A на нуклид, взвешенно</text>
  <text x="484" y="536" class="line">по линиям; МДА по лучшей линии</text>

  <!-- стрелки спектр -> тракты -> формулы -->
  <path d="M 180 227 L 220 227" class="arrow"/>
  <path d="M 180 358 L 220 358" class="arrow"/>
  <path d="M 180 500 L 220 500" class="arrow"/>
  <path d="M 430 227 L 470 227" class="arrow"/>
  <path d="M 430 358 L 470 358" class="arrow"/>
  <path d="M 430 500 L 470 500" class="arrow"/>

  <!-- ОКНА РЕЗУЛЬТАТА -->
  <rect x="790" y="182" width="250" height="100" rx="8" class="box"/>
  <text x="804" y="206" class="title">«Результат измерений»</text>
  <text x="804" y="226" class="line">DCResultView, по ROI при наличии</text>
  <text x="804" y="244" class="line">конфига: зоны — Результат/Неопр./MDA;</text>
  <text x="804" y="262" class="line">единицы cps/Бк, коррекция распада</text>

  <rect x="790" y="310" width="250" height="104" rx="8" class="box"/>
  <text x="804" y="332" class="title">Разрозненный вывод — сейчас</text>
  <text x="804" y="352" class="line">оверлей подписей пиков фита;</text>
  <text x="804" y="370" class="line">таблица найденных пиков;</text>
  <text x="804" y="388" class="line">панель «Выбранная область»: счёт,</text>
  <text x="804" y="406" class="line">Lc/Ld/Lq; A — лишь при кривой ε</text>

  <rect x="790" y="450" width="250" height="140" rx="8" class="newbox"/>
  <text x="804" y="474" class="title">Два окна (НОВОЕ) — сейчас их нет</text>
  <text x="804" y="494" class="line">окно активности по нуклидам: A ± σ,</text>
  <text x="804" y="512" class="line">МДА, статус «оценка→фит» — как</text>
  <text x="804" y="530" class="line">«Активность радионуклидов» SL;</text>
  <text x="804" y="548" class="line">панель деталей по линиям (настраи-</text>
  <text x="804" y="566" class="line">ваемые столбцы); фит — ручной пуск</text>

  <path d="M 730 227 L 790 227" class="arrow"/>
  <path d="M 730 358 L 790 358" class="arrow"/>
  <path d="M 730 500 L 790 500" class="arrow"/>

  <!-- Документ -->
  <rect x="1110" y="260" width="260" height="200" rx="8" class="resbox"/>
  <text x="1124" y="286" class="title">MeasurementResult</text>
  <text x="1124" y="308" class="line">итог обоих трактов: A ± σ, МДА</text>
  <text x="1124" y="328" class="line">+ снапшот: ε, I, геометрия,</text>
  <text x="1124" y="346" class="line">набор+версия, зоны, фон</text>
  <text x="1124" y="370" class="line">СОХРАНЯЕТСЯ в документ;</text>
  <text x="1124" y="388" class="line">пересчёт — явное действие</text>
  <text x="1124" y="412" class="line">окна — отображение,</text>
  <text x="1124" y="430" class="line">документ — истина</text>

  <path d="M 1040 232 L 1075 232 L 1075 310 L 1110 310" class="arrow"/>
  <path d="M 1040 510 L 1075 510 L 1075 410 L 1110 410" class="arrow"/>
  <text x="1046" y="224" class="lbl">фиксация</text>
  <text x="1046" y="502" class="lbl">фиксация</text>

  <text x="30" y="610" class="lbl">Формула А и В одна — различается способ получения net (окно против фита): А — мгновенная оценка при наборе, В — уточнение; метод пишется в снапшот.</text>
  <text x="30" y="630" class="lbl">Окна без нуклида (мониторинг, дозовые полосы) — самостоятельная роль зон. Тракт Б — интерактивная оценка, не сохраняется. Окна — отображение, MeasurementResult — истина.</text>
</svg>
