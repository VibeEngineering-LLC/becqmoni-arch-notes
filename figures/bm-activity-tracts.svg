<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5a7d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef3f9; stroke:#2f5b8f; stroke-width:1.6; }
    .newbox { fill:#fdf6e3; stroke:#c8901e; stroke-width:1.8; }
    .srcbox { fill:#f2f2ee; stroke:#777; stroke-width:1.4; }
    .resbox { fill:#eefaef; stroke:#3c8b46; stroke-width:1.8; }
    .title { font-size:14.5px; font-weight:600; fill:#1d3a57; }
    .line { font-size:12.5px; fill:#333; }
    .f { font-size:13.5px; fill:#1d3a57; font-family:Consolas, monospace; }
    .lbl { font-size:12px; fill:#3a5a7d; font-style:italic; }
    .arrow { stroke:#3a5a7d; stroke-width:1.6; fill:none; marker-end:url(#ar2); }
    .h { font-size:18px; font-weight:600; fill:#1d3a57; }
    .tr { font-size:13px; font-weight:600; fill:#8a6410; }
  </style>

  <text x="30" y="32" class="h">Три тракта расчёта активности (жёлтое — новое)</text>

  <!-- Источники живых величин -->
  <rect x="620" y="56" width="200" height="64" rx="8" class="srcbox"/>
  <text x="636" y="80" class="title">Geometry.ε(E)</text>
  <text x="636" y="100" class="line">выбранная геометрия</text>
  <rect x="850" y="56" width="200" height="64" rx="8" class="srcbox"/>
  <text x="866" y="80" class="title">NuclideSet.I</text>
  <text x="866" y="100" class="line">живой набор нуклидов</text>

  <!-- Спектр -->
  <rect x="30" y="180" width="150" height="330" rx="8" class="box"/>
  <text x="46" y="206" class="title">Спектр</text>
  <text x="46" y="228" class="line">каналы, счёт,</text>
  <text x="46" y="246" class="line">время, фон,</text>
  <text x="46" y="264" class="line">калибровки</text>

  <!-- Тракт А -->
  <text x="220" y="172" class="tr">Тракт А — зонный (декларативный): без поиска пиков</text>
  <rect x="220" y="182" width="220" height="86" rx="8" class="box"/>
  <text x="236" y="206" class="title">Зоны ROI + правила</text>
  <text x="236" y="226" class="line">алгебра примитивов,</text>
  <text x="236" y="244" class="line">вычет фона, ссылки</text>
  <rect x="480" y="182" width="270" height="86" rx="8" class="newbox"/>
  <text x="496" y="206" class="title">A = net_cps / (ε(E)·I/100)</text>
  <text x="496" y="226" class="line">линия — из декларации зоны;</text>
  <text x="496" y="244" class="line">ручной K — если переопределён</text>

  <!-- Тракт Б -->
  <text x="220" y="302" class="tr">Тракт Б — по выделению</text>
  <rect x="220" y="312" width="220" height="70" rx="8" class="box"/>
  <text x="236" y="336" class="title">Выделенный участок</text>
  <text x="236" y="356" class="line">net = fg − bg·(t_fg/t_bg)</text>
  <rect x="480" y="312" width="270" height="70" rx="8" class="box"/>
  <text x="496" y="336" class="title">A = net / (ε·I/100)</text>
  <text x="496" y="356" class="line">единственный идентифицированный пик</text>

  <!-- Тракт В -->
  <text x="220" y="416" class="tr">Тракт В — по набору нуклидов (НОВЫЙ, этап 7): спектрометрический</text>
  <rect x="220" y="426" width="220" height="96" rx="8" class="box"/>
  <text x="236" y="450" class="title">Библиотечный фиттер</text>
  <text x="236" y="470" class="line">площади S_jk линий,</text>
  <text x="236" y="488" class="line">BR-группы, якоря, вето</text>
  <text x="236" y="506" class="line">(ядро не меняется)</text>
  <rect x="480" y="426" width="270" height="96" rx="8" class="newbox"/>
  <text x="496" y="450" class="title">A_j по нуклиду</text>
  <text x="496" y="472" class="f">A_j = Σw·S_jk/(t·ε(E_k)·I_jk)</text>
  <text x="496" y="494" class="line">одна A на нуклид, взвешенно</text>
  <text x="496" y="512" class="line">по линиям; МДА по лучшей линии</text>

  <!-- Результат -->
  <rect x="820" y="300" width="230" height="180" rx="8" class="resbox"/>
  <text x="836" y="326" class="title">MeasurementResult</text>
  <text x="836" y="348" class="line">A ± σ, МДА по трактам</text>
  <text x="836" y="368" class="line">+ снапшот: ε, I, геометрия,</text>
  <text x="836" y="386" class="line">набор+версия, зоны, фон</text>
  <text x="836" y="410" class="line">сохраняется в документ;</text>
  <text x="836" y="428" class="line">пересчёт — явное действие</text>
  <text x="836" y="452" class="line">смена набора → пересчёт</text>
  <text x="836" y="470" class="line">без правки зон</text>

  <!-- Стрелки спектр -> тракты -->
  <path d="M 180 225 L 220 225" class="arrow"/>
  <path d="M 180 347 L 220 347" class="arrow"/>
  <path d="M 180 474 L 220 474" class="arrow"/>

  <!-- тракты -> формулы -->
  <path d="M 440 225 L 480 225" class="arrow"/>
  <path d="M 440 347 L 480 347" class="arrow"/>
  <path d="M 440 474 L 480 474" class="arrow"/>

  <!-- живые величины -> формулы -->
  <path d="M 700 120 L 700 182" class="arrow"/>
  <path d="M 930 120 L 930 160 L 640 160 L 640 182" class="arrow"/>
  <text x="712" y="150" class="lbl">ε и I — живые, в момент расчёта</text>

  <!-- формулы -> результат -->
  <path d="M 750 225 L 890 225 L 890 300" class="arrow"/>
  <path d="M 750 347 L 820 347" class="arrow"/>
  <path d="M 750 474 L 785 474 L 785 420 L 820 420" class="arrow"/>

  <text x="30" y="580" class="lbl">Фиттер площади считает, активность — нет (как сейчас); тракт В — постобработка его площадей. Зона развязана с нуклидом:</text>
  <text x="30" y="600" class="lbl">декларация в зоне — опция тракта А, спектрометрическая активность следует за живым набором.</text>
</svg>
