<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта связей BecqMoni сейчас">
<title>BecqMoni сейчас: сущности и связи</title>
<defs>
<marker id="at" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
<marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#BA7517" stroke-width="1.5"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#A32D2D" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="940" height="600" fill="#FFFFFF"/>
<text x="40" y="30" font-size="18" font-weight="500" fill="#444441" font-family="Segoe UI, sans-serif">Сейчас: четыре сущности, связи разной прочности</text>

<rect x="40" y="220" width="200" height="130" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="60" y="248" font-size="14" font-weight="500" fill="#2C2C2A" font-family="Segoe UI, sans-serif">Спектр-документ</text>
<text x="60" y="270" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">файл .xml с измерением</text>
<text x="60" y="290" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">ссылка на прибор (Guid)</text>
<text x="60" y="308" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">ссылка на ROI (Guid)</text>
<text x="60" y="326" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">фон — по имени файла</text>

<rect x="340" y="60" width="260" height="120" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="360" y="88" font-size="14" font-weight="500" fill="#042C53" font-family="Segoe UI, sans-serif">Прибор (DeviceConfig)</text>
<text x="360" y="110" font-size="12" fill="#185FA5" font-family="Segoe UI, sans-serif">калибровки, FWHM</text>
<text x="360" y="128" font-size="12" fill="#185FA5" font-family="Segoe UI, sans-serif">EfficencyROIGuid — одна кривая</text>
<text x="360" y="146" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">доза: 16 точек в коде формы</text>
<text x="360" y="164" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">геометрий нет как понятия</text>

<rect x="340" y="260" width="260" height="180" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="360" y="288" font-size="14" font-weight="500" fill="#042C53" font-family="Segoe UI, sans-serif">ROI-конфиг — 4 роли в файле</text>
<text x="360" y="310" font-size="12" fill="#185FA5" font-family="Segoe UI, sans-serif">окна счёта + примитивы фона</text>
<text x="360" y="328" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">Bq-коэффициент — заморожен</text>
<text x="360" y="346" font-size="12" fill="#185FA5" font-family="Segoe UI, sans-serif">кривая эффективности ε(E)</text>
<text x="360" y="364" font-size="12" fill="#185FA5" font-family="Segoe UI, sans-serif">маркерные линии для графика</text>
<text x="360" y="384" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">копии файла на каждый прибор</text>
<text x="360" y="402" font-size="12" fill="#BA7517" font-family="Segoe UI, sans-serif">ссылки область→область по имени</text>

<rect x="690" y="260" width="220" height="150" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="710" y="288" font-size="14" font-weight="500" fill="#04342C" font-family="Segoe UI, sans-serif">Библиотека нуклидов</text>
<text x="710" y="310" font-size="12" fill="#0F6E56" font-family="Segoe UI, sans-serif">нуклиды: энергия, I, цвет</text>
<text x="710" y="328" font-size="12" fill="#BA7517" font-family="Segoe UI, sans-serif">цепочка = скобки в имени</text>
<text x="710" y="346" font-size="12" fill="#0F6E56" font-family="Segoe UI, sans-serif">наборы (NuclideSet)</text>
<text x="710" y="364" font-size="12" fill="#0F6E56" font-family="Segoe UI, sans-serif">членство — настоящий Guid</text>
<text x="710" y="382" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">версии формата нет</text>

<rect x="690" y="60" width="220" height="110" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="710" y="88" font-size="14" font-weight="500" fill="#04342C" font-family="Segoe UI, sans-serif">Фиттер (идентификация)</text>
<text x="710" y="110" font-size="12" fill="#0F6E56" font-family="Segoe UI, sans-serif">поиск пиков по набору</text>
<text x="710" y="128" font-size="12" fill="#A32D2D" font-family="Segoe UI, sans-serif">один якорь открывает набор</text>
<text x="710" y="146" font-size="12" fill="#0F6E56" font-family="Segoe UI, sans-serif">veto по форме ε(E)</text>

<path d="M240,260 L290,260 L290,130 L340,130" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="248" y="200" font-size="11" fill="#0F6E56" font-family="Segoe UI, sans-serif">Guid</text>
<text x="248" y="214" font-size="11" fill="#A32D2D" font-family="Segoe UI, sans-serif">не нашёл — молчит</text>

<path d="M240,320 L340,320" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="252" y="312" font-size="11" fill="#0F6E56" font-family="Segoe UI, sans-serif">Guid</text>

<path d="M470,180 L470,260" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="482" y="205" font-size="11" fill="#A32D2D" font-family="Segoe UI, sans-serif">в поставке пусто →</text>
<text x="482" y="219" font-size="11" fill="#A32D2D" font-family="Segoe UI, sans-serif">берётся первый попавшийся</text>

<path d="M800,260 L800,170" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="812" y="222" font-size="11" fill="#0F6E56" font-family="Segoe UI, sans-serif">набор → фит (Guid)</text>

<path d="M600,330 L645,330 L645,140 L690,140" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="608" y="255" font-size="11" fill="#0F6E56" font-family="Segoe UI, sans-serif">копия кривой</text>
<text x="608" y="269" font-size="11" fill="#0F6E56" font-family="Segoe UI, sans-serif">при совпадении Guid</text>

<path d="M690,335 L600,335" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="608" y="352" font-size="11" fill="#A32D2D" font-family="Segoe UI, sans-serif">копия полей при создании,</text>
<text x="608" y="366" font-size="11" fill="#A32D2D" font-family="Segoe UI, sans-serif">обратной связи нет</text>

<rect x="40" y="470" width="870" height="100" rx="8" fill="none" stroke="#D3D1C7"/>
<text x="60" y="498" font-size="13" font-weight="500" fill="#444441" font-family="Segoe UI, sans-serif">Прочность связи</text>
<line x1="60" y1="520" x2="100" y2="520" stroke="#0F6E56" stroke-width="2"/>
<text x="110" y="524" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">надёжная: настоящий Guid или копия по Guid</text>
<line x1="60" y1="543" x2="100" y2="543" stroke="#BA7517" stroke-width="2"/>
<text x="110" y="547" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">конвенция: смысл спрятан в строке (скобки имени, имя области, имя файла)</text>
<line x1="470" y1="520" x2="510" y2="520" stroke="#A32D2D" stroke-width="2"/>
<text x="520" y="524" font-size="12" fill="#5F5E5A" font-family="Segoe UI, sans-serif">хрупкая: замороженное число, молчаливый откат, выбор индексом списка</text>
</svg>
