<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта связей BecqMoni сейчас" font-family="Segoe UI, sans-serif">
<title>BecqMoni сейчас: сущности и связи</title>
<defs>
<marker id="at" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#A32D2D" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="620" fill="#FFFFFF"/>
<text x="40" y="30" font-size="18" font-weight="500" fill="#444441">Сейчас: четыре сущности, связи разной прочности</text>

<rect x="40" y="220" width="200" height="130" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="60" y="248" font-size="14" font-weight="500" fill="#2C2C2A">Спектр-документ</text>
<text x="60" y="270" font-size="12" fill="#5F5E5A">файл .xml с измерением</text>
<text x="60" y="290" font-size="12" fill="#5F5E5A">ссылка на прибор (Guid)</text>
<text x="60" y="308" font-size="12" fill="#5F5E5A">ссылка на ROI (Guid)</text>
<text x="60" y="326" font-size="12" fill="#5F5E5A">фон — по имени файла</text>

<rect x="340" y="60" width="260" height="120" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="360" y="88" font-size="14" font-weight="500" fill="#042C53">Прибор (DeviceConfig)</text>
<text x="360" y="110" font-size="12" fill="#185FA5">калибровки, FWHM</text>
<text x="360" y="128" font-size="12" fill="#185FA5">EfficencyROIGuid — одна кривая</text>
<text x="360" y="146" font-size="12" fill="#A32D2D">доза: 16 точек в коде формы</text>
<text x="360" y="164" font-size="12" fill="#A32D2D">геометрий нет как понятия</text>

<rect x="340" y="260" width="260" height="180" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="360" y="288" font-size="14" font-weight="500" fill="#042C53">ROI-конфиг — 4 роли в файле</text>
<text x="360" y="310" font-size="12" fill="#185FA5">окна счёта + примитивы фона</text>
<text x="360" y="328" font-size="12" fill="#A32D2D">Bq-коэффициент — заморожен</text>
<text x="360" y="346" font-size="12" fill="#185FA5">кривая эффективности ε(E)</text>
<text x="360" y="364" font-size="12" fill="#185FA5">маркерные линии для графика</text>
<text x="360" y="384" font-size="12" fill="#A32D2D">копии файла на каждый прибор</text>
<text x="360" y="402" font-size="12" fill="#BA7517">ссылки область→область по имени</text>

<rect x="830" y="260" width="220" height="150" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="850" y="288" font-size="14" font-weight="500" fill="#04342C">Библиотека нуклидов</text>
<text x="850" y="310" font-size="12" fill="#0F6E56">нуклиды: энергия, I, цвет</text>
<text x="850" y="328" font-size="12" fill="#BA7517">цепочка = скобки в имени</text>
<text x="850" y="346" font-size="12" fill="#0F6E56">наборы (NuclideSet)</text>
<text x="850" y="364" font-size="12" fill="#0F6E56">членство — настоящий Guid</text>
<text x="850" y="382" font-size="12" fill="#A32D2D">версии формата нет</text>

<rect x="830" y="60" width="220" height="110" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="850" y="88" font-size="14" font-weight="500" fill="#04342C">Фиттер (идентификация)</text>
<text x="850" y="110" font-size="12" fill="#0F6E56">поиск пиков по набору</text>
<text x="850" y="128" font-size="12" fill="#A32D2D">один якорь открывает набор</text>
<text x="850" y="146" font-size="12" fill="#0F6E56">veto по форме ε(E)</text>

<path d="M240,260 L290,260 L290,130 L340,130" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="248" y="200" font-size="11" fill="#0F6E56">Guid</text>
<text x="248" y="214" font-size="11" fill="#A32D2D">не нашёл — молчит</text>

<path d="M240,320 L340,320" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="252" y="312" font-size="11" fill="#0F6E56">Guid</text>

<path d="M470,180 L470,260" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="482" y="205" font-size="11" fill="#A32D2D">в поставке пусто:</text>
<text x="482" y="219" font-size="11" fill="#A32D2D">берётся первый попавшийся</text>

<path d="M940,260 L940,170" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="820" y="222" font-size="11" fill="#0F6E56">набор в фит (Guid)</text>

<path d="M600,330 L700,330 L700,115 L830,115" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text x="612" y="248" font-size="11" fill="#0F6E56">копия кривой</text>
<text x="612" y="262" font-size="11" fill="#0F6E56">при совпадении Guid</text>

<path d="M830,350 L600,350" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="612" y="368" font-size="11" fill="#A32D2D">копия полей при создании,</text>
<text x="612" y="382" font-size="11" fill="#A32D2D">обратной связи нет</text>

<rect x="40" y="480" width="1010" height="100" rx="8" fill="none" stroke="#D3D1C7"/>
<text x="60" y="508" font-size="13" font-weight="500" fill="#444441">Прочность связи</text>
<line x1="60" y1="530" x2="100" y2="530" stroke="#0F6E56" stroke-width="2"/>
<text x="110" y="534" font-size="12" fill="#5F5E5A">надёжная: настоящий Guid или копия по Guid</text>
<line x1="60" y1="553" x2="100" y2="553" stroke="#BA7517" stroke-width="2"/>
<text x="110" y="557" font-size="12" fill="#5F5E5A">конвенция: смысл спрятан в строке (скобки имени, имя области, имя файла)</text>
<line x1="560" y1="530" x2="600" y2="530" stroke="#A32D2D" stroke-width="2"/>
<text x="610" y="534" font-size="12" fill="#5F5E5A">хрупкая: замороженное число, молчаливый откат, выбор индексом списка</text>
</svg>
